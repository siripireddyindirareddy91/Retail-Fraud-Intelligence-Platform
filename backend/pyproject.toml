[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-fraud-backend"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135.1,<1", "uvicorn>=0.41,<1", "pydantic>=2.12.5,<3",
  "pydantic-settings>=2.12,<3", "SQLAlchemy>=2.0.51,<2.1", "alembic>=1.18.4,<2",
  "psycopg[binary]>=3.2,<4", "argon2-cffi>=25.1,<26", "PyJWT>=2.12.1,<3",
  "email-validator>=2.3,<3", "filelock>=3.25,<4",
  "numpy>=2.2,<3", "pandas>=2.3,<3", "scipy>=1.16,<2", "scikit-learn>=1.8,<2",
  "joblib>=1.5,<2",
  "xgboost>=3.1,<4", "shap>=0.50,<1", "sdv>=1.30,<2", "mlflow>=3.14,<4",
  "reportlab>=4.4,<6", "matplotlib>=3.10,<4", "pyarrow>=20,<25"
]

[project.optional-dependencies]
test = ["pytest>=9.1,<10", "httpx>=0.28.1,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
